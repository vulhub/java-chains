schema_version: 1

# Pin runtime packaging repositories for reproducible product releases.
#
# Product bits are built in this repository from the Java-Chains/chains source
# tag: public-edition source/unit checks, then `mvn -Pfrontend` for server +
# both SPAs + CLI. This repository overlays pinned chains-config, bundles JDK 8,
# and (when publish=true) pushes Docker. Do not enable with-exploits or
# with-rmi-workbench.
#
# Naming (2026):
#   - Backend / packaging monorepo: Java-Chains/chains
#   - Product SPAs: built from that source tag (React at `/`, Element at `/element/`)
#   - This repository: public product release/CI home (vulhub/java-chains)
dependencies:
  chains_config:
    repository: Java-Chains/chains-config
    ref: c9e027059f82c37df0e026bd190499d2ddc7b223
