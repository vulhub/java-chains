# Pin runtime packaging repositories for reproducible product releases.
#
# Product bits come from the verified Java-Chains/chains GitHub Release asset
# `tag-build.tar.gz` (public edition, profiles=frontend, both SPAs already baked
# into the server jar). This repository only overlays pinned chains-config,
# bundles JDK 8, and pushes Docker. Do not rebuild with Maven.
#
# Naming (2026):
#   - Backend / packaging monorepo: Java-Chains/chains
#   - Product SPAs: baked into the tagged public jar (React at `/`, Element at `/element/`)
#   - This repository: public product release/CI home (vulhub/java-chains)
dependencies:
  chains_config:
    repository: Java-Chains/chains-config
    ref: c9e027059f82c37df0e026bd190499d2ddc7b223
