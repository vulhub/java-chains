schema_version: 1

# Pin dependency repositories for reproducible product releases.
# Bump a ref only when that repository's content must change for the release.
#
# Naming (2026):
#   - Backend / packaging monorepo: Java-Chains/chains
#   - Product SPA: chains/java-chains-web-element (Vue3 + Element Plus, in-tree)
#     Built with pnpm in release CI, then packaged into the server jar via -Pfrontend
#     + .github/scripts/package-java-chains-web-element.sh (not React java-chains-web).
#   - This repository: product release/CI home (java-chains; formerly web-chains)
dependencies:
  chains_dev_jars:
    repository: Java-Chains/chains-dev-jars
    ref: 7e5a0b57126a31750c52b9ba09580ae63a3e8f0f

  java_echo_generator:
    repository: Java-Chains/java-echo-generator
    ref: a5dd7275d50a1f08328d12bd2373ed5d8fe8cc78

  java_memshell_generator:
    repository: Java-Chains/java-memshell-generator
    ref: 965c630fa288fd7954dcf68009481d45d5cd81c8

  chains_config:
    repository: Java-Chains/chains-config
    ref: c9e027059f82c37df0e026bd190499d2ddc7b223
