# Nightly builds for the java-chains release repository (formerly web-chains).
# Backend: Java-Chains/chains | SPA: in-tree java-chains-web-element (Vue Element Plus)
name: Nightly Build

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag in Java-Chains/chains only (no commit SHA). Defaults to v2-dev. Names containing 'internal' are rejected."
        required: false
        type: string
        default: 'v2-dev'
      skip_docker:
        description: "Skip Docker build"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # ====================================================
  # Job 0: 检查是否有新提交（定时触发时跳过无变更的构建）
  # ====================================================
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      nightly_version: ${{ steps.check.outputs.nightly_version }}
      source_ref: ${{ steps.check.outputs.source_ref }}
    steps:
      - name: Check for Recent Changes
        id: check
        env:
          DEPENDENCY_REPO_TOKEN: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_REF="${{ inputs.source_ref || 'v2-dev' }}"

          # Public nightly: branch/tag only; never commit SHA; never *internal* refs.
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "source_ref must be a branch or tag name, not a commit SHA: $SOURCE_REF"
            exit 1
          fi
          if [[ "$SOURCE_REF" == refs/* ]] || [[ "$SOURCE_REF" == *".."* ]] || [[ "$SOURCE_REF" == *" "* ]]; then
            echo "source_ref must be a plain branch or tag name: $SOURCE_REF"
            exit 1
          fi
          SOURCE_REF_LC="$(printf '%s' "$SOURCE_REF" | tr '[:upper:]' '[:lower:]')"
          if [[ "$SOURCE_REF_LC" == *internal* ]]; then
            echo "Refusing public Nightly Build for internal source_ref: $SOURCE_REF"
            echo "Use a public branch/tag (e.g. v2-dev), or the internal release workflow."
            exit 1
          fi
          if [ -z "${DEPENDENCY_REPO_TOKEN:-}" ]; then
            echo "DEPENDENCY_REPO_TOKEN is required to validate source_ref against Java-Chains/chains"
            exit 1
          fi
          CHAINS_URL="https://x-access-token:${DEPENDENCY_REPO_TOKEN}@github.com/Java-Chains/chains.git"
          REF_LINES="$(git ls-remote "$CHAINS_URL" \
            "refs/heads/${SOURCE_REF}" \
            "refs/tags/${SOURCE_REF}" \
            "refs/tags/${SOURCE_REF}^{}" || true)"
          if [ -z "$(printf '%s' "$REF_LINES" | tr -d '[:space:]')" ]; then
            echo "source_ref must exist as refs/heads/* or refs/tags/* in Java-Chains/chains: $SOURCE_REF"
            echo "Commit SHAs and other object ids are not accepted."
            exit 1
          fi
          echo "Validated public source_ref as branch/tag:"
          printf '%s\n' "$REF_LINES"

          SOURCE_SHA="$(printf '%s\n' "$REF_LINES" | awk '
            $2 ~ /\^\{\}$/ { peel=$1 }
            $2 ~ /^refs\/heads\// { head=$1 }
            $2 ~ /^refs\/tags\// && $2 !~ /\^\{\}$/ { tag=$1 }
            END {
              if (peel != "") { print peel; exit }
              if (head != "") { print head; exit }
              if (tag != "") { print tag; exit }
            }
          ')"
          if [ -z "$SOURCE_SHA" ]; then
            echo "Cannot resolve branch/tag SHA for: $SOURCE_REF"
            exit 1
          fi

          SHORT_SHA="${SOURCE_SHA:0:7}"
          NIGHTLY_VERSION="nightly-$(date -u +%Y%m%d)-${SHORT_SHA}"

          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "nightly_version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_NIGHTLY_SHA=""
          RELEASE_JSON=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body 2>/dev/null || true)
          if [ -n "$RELEASE_JSON" ]; then
            LAST_NIGHTLY_SHA=$(echo "$RELEASE_JSON" | jq -r '.body' | grep -oP 'Backend commit\s*[:|]\s*\K[0-9a-f]{7,40}' | head -1 || true)
            if [ -z "$LAST_NIGHTLY_SHA" ]; then
              LAST_NIGHTLY_SHA=$(echo "$RELEASE_JSON" | jq -r '.body' | grep -oP 'Source commit\s*[:|]\s*\K[0-9a-f]{7,40}' | head -1 || true)
            fi
          fi
          echo "Last nightly SHA: ${LAST_NIGHTLY_SHA:-<none>}"
          echo "Current source SHA: $SOURCE_SHA"

          if [ -n "$LAST_NIGHTLY_SHA" ] && [ "$SOURCE_SHA" = "$LAST_NIGHTLY_SHA" ]; then
            echo "No new commits since last nightly build, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected, building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ====================================================
  # Job 1: 核心构建
  # ====================================================
  build:
    needs: check_changes
    if: needs.check_changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      frontend_sha: ${{ steps.frontend.outputs.frontend_sha }}
    env:
      JAVA_VERSION: '8'

    steps:
      - name: Checkout Release Repo
        uses: actions/checkout@v4

      - name: Read Release Manifest
        id: manifest
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'yaml'

          manifest = YAML.safe_load(File.read('.github/release-manifest.yml'), aliases: false)
          dependencies = manifest.fetch('dependencies')
          required = %w[
            chains_dev_jars
            java_echo_generator
            java_memshell_generator
            chains_config
          ]

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |out|
            required.each do |name|
              entry = dependencies[name] || abort("Missing dependency entry: #{name}")
              repository = entry['repository'].to_s.strip
              ref = entry['ref'].to_s.strip

              abort("Missing repository for #{name}") if repository.empty?
              abort("Missing ref for #{name}") if ref.empty?

              out.puts "#{name}_repository=#{repository}"
              out.puts "#{name}_ref=#{ref}"
            end
          end
          RUBY

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: Java-Chains/chains
          ref: ${{ needs.check_changes.outputs.source_ref }}
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Clone Pinned Dependency Repositories
        env:
          DEPENDENCY_REPO_TOKEN: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
        run: |
          mkdir -p release-deps

          clone_repo() {
            local repository="$1"
            local directory="$2"
            local ref="$3"
            local url="https://x-access-token:${DEPENDENCY_REPO_TOKEN}@github.com/${repository}.git"

            echo "Cloning ${repository} @ ${ref}"
            git init "$directory"
            git -C "$directory" remote add origin "$url"
            git -C "$directory" fetch --depth 1 origin "$ref"
            git -C "$directory" checkout FETCH_HEAD
            echo "Resolved $(git -C "$directory" rev-parse HEAD) for ${repository}"
          }

          clone_repo "${{ steps.manifest.outputs.chains_dev_jars_repository }}" "release-deps/chains-dev-jars" "${{ steps.manifest.outputs.chains_dev_jars_ref }}"
          clone_repo "${{ steps.manifest.outputs.java_echo_generator_repository }}" "release-deps/java-echo-generator" "${{ steps.manifest.outputs.java_echo_generator_ref }}"
          clone_repo "${{ steps.manifest.outputs.java_memshell_generator_repository }}" "release-deps/java-memshell-generator" "${{ steps.manifest.outputs.java_memshell_generator_ref }}"
          clone_repo "${{ steps.manifest.outputs.chains_config_repository }}" "release-deps/chains-config" "${{ steps.manifest.outputs.chains_config_ref }}"

      - name: Resolve Element Frontend Revision
        id: frontend
        shell: bash
        run: |
          test -f source/java-chains-web-element/package.json
          test -f source/java-chains-web-element/pnpm-lock.yaml
          FRONTEND_SHA="$(git -C source log -1 --format=%H -- java-chains-web-element)"
          FRONTEND_CT="$(git -C source log -1 --format=%ct -- java-chains-web-element)"
          echo "frontend_sha=${FRONTEND_SHA}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=${FRONTEND_CT}" >> "$GITHUB_ENV"
          echo "Using source/java-chains-web-element @ ${FRONTEND_SHA}"

      - name: Set up Temurin JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-nightly-v2-${{ hashFiles('source/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-nightly-v2-
            ${{ runner.os }}-maven-nightly-
            ${{ runner.os }}-maven-

      - name: Install Dev Jars
        run: |
          cd release-deps/chains-dev-jars
          bash mvn_install.sh

      - name: Build and Install Generators
        run: |
          cd release-deps/java-echo-generator
          mvn clean install -DskipTests

          cd ../../release-deps/java-memshell-generator
          mvn clean install -DskipTests

      - name: Build Ship Artifacts
        run: |
          cd source
          if [ ! -f scripts/frontend/package-java-chains-web-element.sh ]; then
            install -m 0755 ../.github/scripts/package-java-chains-web-element.sh \
              scripts/frontend/package-java-chains-web-element.sh
          fi

          # ONE Maven invocation — avoid Vector A session mismatch from a second -am package.
          # Product surface: server + java-chains-cli (no java-chains-sdk).
          mvn -pl java-chains-server,java-chains-cli -am clean package \
            -DskipTests -Pfrontend,with-exploits \
            -Dfrontend.working.directory="${PWD}/java-chains-web-element" \
            -Dfrontend.package.script="${PWD}/scripts/frontend/package-java-chains-web-element.sh"

      - name: Prepare Base Artifacts
        run: |
          mkdir -p release_base
          VERSION="$(sed -n '0,/<version>/s/.*<version>\([^<]*\)<\/version>.*/\1/p' source/pom.xml | head -n 1)"
          echo "Resolved source version: ${VERSION:-<unknown>}"

          pick_first() {
            local candidate
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }

          SERVER_JAR="$(pick_first \
            "source/java-chains-${VERSION}-exec.jar" \
            "source/java-chains-server-${VERSION}-exec.jar" \
            "source/java-chains-server/target/java-chains-server-${VERSION}-exec.jar" \
            "source/java-chains-server/target/java-chains-${VERSION}-exec.jar" \
          )" || true

          if [ -z "${SERVER_JAR:-}" ]; then
            SERVER_JAR="$(find source -maxdepth 2 -type f \( \
              -name "java-chains-*-exec.jar" -o -name "java-chains-server-*-exec.jar" \
            \) ! -name "*-sources.jar" ! -name "*-javadoc.jar" | sort | head -n 1 || true)"
          fi

          if [ -f "${SERVER_JAR:-}" ]; then
            echo "Found Server Jar: ${SERVER_JAR}"
            cp "$SERVER_JAR" release_base/java-chains.jar
          else
            echo "Error: java-chains server exec jar not found"
            find source -maxdepth 3 -type f -name "*.jar" | sort | head -n 80
            exit 1
          fi

          CLI_JAR="$(pick_first \
            "source/java-chains-cli/target/java-chains-cli-${VERSION}-jar-with-dependencies.jar" \
            "source/java-chains-cli/target/java-chains-cli-${VERSION}.jar" \
          )" || true
          if [ -z "${CLI_JAR:-}" ]; then
            CLI_JAR="$(find source/java-chains-cli/target -type f -name "java-chains-cli-*-jar-with-dependencies.jar" 2>/dev/null | sort | head -n 1 || true)"
          fi
          if [ -f "${CLI_JAR:-}" ]; then
            echo "Found CLI Jar: ${CLI_JAR}"
            cp "$CLI_JAR" release_base/java-chains-cli.jar
          else
            echo "Warning: java-chains-cli jar not found, skipping"
          fi

          CLI_REMOTE_JAR="$(find source/java-chains-cli-remote/target -type f -name "java-chains-cli-remote-*-jar-with-dependencies.jar" 2>/dev/null | sort | head -n 1 || true)"
          if [ -f "${CLI_REMOTE_JAR:-}" ]; then
            cp "$CLI_REMOTE_JAR" release_base/java-chains-cli-remote.jar
          fi

          cp -r release-deps/chains-config release_base/chains-config
          rm -rf release_base/chains-config/.git
          if [ -d source/chains-config ]; then
            cp -a source/chains-config/. release_base/chains-config/ 2>/dev/null || true
            rm -rf release_base/chains-config/.git
          fi

      - name: Purge
        if: always()
        run: |
          rm -rf source release-deps
          rm -rf ~/.m2/repository

          echo "=== Artifact integrity check ==="
          if find release_base -type f \( \
            -name "*.java" -o -name "*.go" -o -name "*.ts" -o -name "*.tsx" \
            -o -name "*.vue" -o -name "*.jsx" -o -name "*.py" \
            -o -name "*-sources.jar" -o -name "*-javadoc.jar" \
            -o -name ".git" -o -name ".gitignore" \
            -o -name "pom.xml" -o -name "package.json" -o -name "go.mod" \
          \) | grep -q .; then
            echo "ERROR: detected in release artifacts!"
            find release_base -type f \( \
              -name "*.java" -o -name "*.go" -o -name "*.ts" -o -name "*.tsx" \
              -o -name "*.vue" -o -name "*.jsx" -o -name "*.py" \
              -o -name "*-sources.jar" -o -name "*-javadoc.jar" \
              -o -name ".git" -o -name ".gitignore" \
              -o -name "pom.xml" -o -name "package.json" -o -name "go.mod" \
            \)
            exit 1
          fi

          find release_base -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          echo "Artifact contents:"
          find release_base -type f | sort
          echo "=== All clean ==="

      - name: Upload Base Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-artifacts
          path: release_base/
          retention-days: 3

  # ====================================================
  # Job 2: 更新 Nightly Release
  # ====================================================
  publish_nightly:
    needs: [check_changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nightly-artifacts
          path: base

      - name: Package Nightly Artifacts
        run: |
          NIGHTLY_VERSION="${{ needs.check_changes.outputs.nightly_version }}"

          tar -czf "java-chains-${NIGHTLY_VERSION}.tar.gz" -C base java-chains.jar chains-config

          if [ -f base/java-chains-cli.jar ]; then
            mkdir -p cli_dist
            cp base/java-chains-cli.jar cli_dist/
            cp -r base/chains-config cli_dist/
            if [ -f base/java-chains-cli-remote.jar ]; then
              cp base/java-chains-cli-remote.jar cli_dist/
            fi
            tar -czf "java-chains-cli-${NIGHTLY_VERSION}.tar.gz" -C cli_dist .
          fi

      - name: Update Nightly Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NIGHTLY_VERSION="${{ needs.check_changes.outputs.nightly_version }}"
          SOURCE_SHA="${{ needs.check_changes.outputs.source_sha }}"
          SOURCE_REF="${{ needs.check_changes.outputs.source_ref }}"
          FRONTEND_SHA="${{ needs.build.outputs.frontend_sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%d)

          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push --delete origin nightly 2>/dev/null || true

          BODY=$(cat <<EOF
          ## Nightly Build — ${BUILD_DATE}

          > **This is an automated nightly build and may be unstable.**

          | Key | Value |
          |-----|-------|
          | Backend ref | ${SOURCE_REF} |
          | Backend commit | ${SOURCE_SHA} |
          | Frontend | java-chains-web-element |
          | Frontend commit | ${FRONTEND_SHA} |
          | Build version | ${NIGHTLY_VERSION} |
          | Build date | ${BUILD_DATE} |

          ### Artifacts
          - \`java-chains-${NIGHTLY_VERSION}.tar.gz\` — Server (SPA from java-chains-web-element) + Config
          - \`java-chains-cli-${NIGHTLY_VERSION}.tar.gz\` — Product CLI
          EOF
          )

          ASSETS=()
          for f in *.tar.gz; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly Build (${BUILD_DATE})" \
            --notes "$BODY" \
            --prerelease \
            "${ASSETS[@]}"

  # ====================================================
  # Job 3: Nightly Docker Build
  # ====================================================
  docker_nightly:
    needs: [check_changes, build]
    if: ${{ inputs.skip_docker != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: nightly-artifacts
          path: docker-context

      - name: Prepare Docker Context (no source code)
        run: |
          rm -f docker-context/java-chains-cli.jar
          rm -f docker-context/java-chains-cli-remote.jar

          cp Dockerfile docker-context/

          test -f docker-context/java-chains.jar
          test -d docker-context/chains-config

          echo "Docker context contents:"
          find docker-context -type f | sort

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          file: docker-context/Dockerfile
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            javachains/javachains:nightly
            javachains/javachains:nightly-${{ needs.check_changes.outputs.short_sha }}
