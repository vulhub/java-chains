# Public product release CI for vulhub/java-chains.
# Checks out the Java-Chains/chains source tag, runs public-edition tests,
# packages with -Pfrontend, then overlays pinned chains-config and bundles JDK 8.
# Docker Hub is pushed only when publish=true. Actions artifacts are not used.
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Public release version without leading v (e.g. 2.0.0-beta3). Must not contain internal."
        required: true
        type: string
      source_ref:
        description: "Java-Chains/chains source tag. Empty = v<version>; any other value must equal v<version>."
        required: false
        type: string
      publish:
        description: "Publish the GitHub Release immediately (skip draft). Default: draft only."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Same prerelease version must not race its release/assets. Stable releases also
# share the mutable Docker `latest` tag, so serialize all stable versions.
concurrency:
  group: release-${{ contains(inputs.version, '-') && format('prerelease-{0}', inputs.version) || 'stable' }}
  cancel-in-progress: false

jobs:
  resolve_release_meta:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      packaging_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      chains_config_repository: ${{ steps.manifest.outputs.chains_config_repository }}
      chains_config_ref: ${{ steps.manifest.outputs.chains_config_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test public release contracts
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/test-git-authed.sh
          bash .github/scripts/test-public-ship-surface.sh
          bash .github/scripts/test-verify-source-tag.sh
          bash .github/scripts/test-package-public-from-source-contract.sh
          bash .github/scripts/test-fetch-release-tarball.sh
          bash .github/scripts/test-verify-tag-build-artifact.sh
          bash .github/scripts/test-public-release-workflow-contract.sh

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          VERSION="${VERSION_INPUT#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION_INPUT"
            echo "Use SemVer, for example: 2.0.0 or 2.0.0-beta3"
            exit 1
          fi

          VERSION_LC="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$VERSION_LC" == *internal* ]]; then
            echo "public version must not contain internal: $VERSION"
            exit 1
          fi

          RELEASE_TAG="v$VERSION"

          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          # workflow_dispatch boolean → string "true"/"false"; default draft.
          PUBLISH_INPUT="${{ inputs.publish }}"
          if [ "$PUBLISH_INPUT" = "true" ]; then
            PUBLISH_RELEASE="true"
          else
            PUBLISH_RELEASE="false"
          fi

          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH_RELEASE"
          {
            echo "docker_tags<<EOF"
            echo "javachains/javachains:${VERSION}"
            if [ "$IS_PRERELEASE" != "true" ] && [ "$PUBLISH_RELEASE" = "true" ]; then
              echo "javachains/javachains:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve public source tag
        id: source
        env:
          DEPENDENCY_REPO_TOKEN: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: .github/scripts/verify-source-tag.sh

      - name: Read Release Manifest
        id: manifest
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'yaml'

          manifest = YAML.safe_load(File.read('.github/release-manifest.yml'), aliases: false)
          dependencies = manifest.fetch('dependencies')
          required = %w[chains_config]

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |out|
            required.each do |name|
              entry = dependencies[name] || abort("Missing dependency entry: #{name}")
              repository = entry['repository'].to_s.strip
              ref = entry['ref'].to_s.strip

              abort("Missing repository for #{name}") if repository.empty?
              abort("Missing ref for #{name}") if ref.empty?

              out.puts "#{name}_repository=#{repository}"
              out.puts "#{name}_ref=#{ref}"
            end
          end
          RUBY

  build:
    needs: resolve_release_meta
    name: package public edition from source tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.evidence.outputs.source_sha }}
      frontend_sha: ${{ steps.evidence.outputs.frontend_sha }}
      frontend_react_sha: ${{ steps.evidence.outputs.frontend_react_sha }}
      frontend_element_sha: ${{ steps.evidence.outputs.frontend_element_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout public source tag
        uses: actions/checkout@v4
        with:
          repository: Java-Chains/chains
          ref: ${{ needs.resolve_release_meta.outputs.source_ref }}
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: source/pom.xml

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
          cache-dependency-path: source/java-chains-web-element/pnpm-lock.yaml

      - name: Test and package public edition
        env:
          SOURCE_DIR: source
          OUTPUT_DIR: tagged-build
          EXPECTED_VERSION: ${{ needs.resolve_release_meta.outputs.release_version }}
          EXPECTED_TAG: ${{ needs.resolve_release_meta.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve_release_meta.outputs.source_sha }}
        run: .github/scripts/package-public-from-source.sh

      - name: Verify packaged public build evidence
        id: evidence
        shell: bash
        env:
          TAG_BUILD_DIR: tagged-build
          EXPECTED_TAG: ${{ needs.resolve_release_meta.outputs.source_ref }}
          EXPECTED_SOURCE_SHA: ${{ needs.resolve_release_meta.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.resolve_release_meta.outputs.release_version }}
          EXPECTED_EDITION: public
          EXPECTED_PROFILES: frontend
        run: .github/scripts/verify-tag-build-artifact.sh

      - name: Reject internal sidecar layout
        run: |
          set -euo pipefail
          if [ -e tagged-build/lib ]; then
            echo "Public tagged build must not include tagged-build/lib"
            find tagged-build/lib -type f | sort
            exit 1
          fi
          test ! -f tagged-build/INTERNAL.txt

      - name: Verify Public Ship Surface
        run: |
          set -euo pipefail
          test -f tagged-build/java-chains.jar
          .github/scripts/verify-public-ship-surface.sh tagged-build/java-chains.jar

      - name: Checkout pinned runtime configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve_release_meta.outputs.chains_config_repository }}
          ref: ${{ needs.resolve_release_meta.outputs.chains_config_ref }}
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
          path: release-deps/chains-config
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare public base artifacts
        run: |
          set -euo pipefail
          mkdir -p release_base
          test -f tagged-build/java-chains.jar
          test -f tagged-build/java-chains-cli.jar
          test -f tagged-build/RELEASE-NOTES.md
          cp tagged-build/java-chains.jar release_base/java-chains.jar
          cp tagged-build/java-chains-cli.jar release_base/java-chains-cli.jar
          cp tagged-build/RELEASE-NOTES.md release_base/RELEASE-NOTES.md
          cp tagged-build/TAG-BUILD.txt release_base/TAG-BUILD.txt

          cp -r release-deps/chains-config release_base/chains-config
          rm -rf release_base/chains-config/.git
          mkdir -p release_base/chains-config/presets
          cp tagged-build/chains-config/presets/official-presets.yaml \
            release_base/chains-config/presets/official-presets.yaml

          echo "Artifact layout:"
          find release_base -type f | sort

      - name: Purge packaging clones from runner
        if: always()
        run: |
          set -euo pipefail
          rm -rf release-deps
          if [ -d release_base ] && find release_base -type f \( \
            -name "*.java" -o -name "*.go" -o -name "*.ts" -o -name "*.tsx" \
            -o -name "*.vue" -o -name "*.jsx" -o -name "*.py" \
            -o -name "*-sources.jar" -o -name "*-javadoc.jar" \
            -o -name "pom.xml" -o -name "package.json" \
          \) | grep -q .; then
            echo "ERROR: Source code files detected in release artifacts!"
            find release_base -type f | sort
            exit 1
          fi
          find release_base -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

      - name: Push public base to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          tar -C release_base -czf public-base.tar.gz .
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $RELEASE_TAG" \
              --notes "Public packaging in progress for ${RELEASE_TAG}." \
              --draft
          fi
          gh release upload "$RELEASE_TAG" public-base.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  create_release:
    needs: [ resolve_release_meta, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch verified release notes from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAINS_RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: .github/scripts/fetch-release-tarball.sh public-base.tar.gz base

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.resolve_release_meta.outputs.release_tag }}"
          RELEASE_VERSION="${{ needs.resolve_release_meta.outputs.release_version }}"
          SOURCE_REF="${{ needs.resolve_release_meta.outputs.source_ref }}"
          SOURCE_SHA="${{ needs.build.outputs.source_sha }}"
          PACKAGING_URL="${{ needs.resolve_release_meta.outputs.packaging_run_url }}"
          FRONTEND_SHA="${{ needs.build.outputs.frontend_sha }}"
          FRONTEND_REACT_SHA="${{ needs.build.outputs.frontend_react_sha }}"
          FRONTEND_ELEMENT_SHA="${{ needs.build.outputs.frontend_element_sha }}"
          IS_PRERELEASE="${{ needs.resolve_release_meta.outputs.is_prerelease }}"
          PUBLISH_RELEASE="${{ needs.resolve_release_meta.outputs.publish_release }}"

          test -f base/RELEASE-NOTES.md
          cat > release-notes.txt <<EOF
          Auto-generated public release for version ${RELEASE_VERSION}

          Backend repository: Java-Chains/chains
          Source tag: ${SOURCE_REF}
          Backend commit: ${SOURCE_SHA}
          Packaged in this workflow from the source tag (public-edition tests + \`-Pfrontend\`): ${PACKAGING_URL}

          Frontend: dual SPA built from the source tag (React at \`/\`, Element at \`/element/\`)
          Frontend commit (default React SPA): ${FRONTEND_SHA}
          Frontend commit (React): ${FRONTEND_REACT_SHA}
          Frontend commit (Element): ${FRONTEND_ELEMENT_SHA}

          EOF
          cat base/RELEASE-NOTES.md >> release-notes.txt
          cat >> release-notes.txt <<EOF

          Artifacts:
          - java-chains-${RELEASE_VERSION}.tar.gz — Server (both SPAs) + chains-config
          - java-chains-${RELEASE_VERSION}-<platform>.tar.gz|zip — Server + bundled JDK 8
          - java-chains-cli-${RELEASE_VERSION}.tar.gz — Product CLI fat jar + chains-config
          - Docker: javachains/javachains:${RELEASE_VERSION}
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; update notes and publish flags."
            EDIT_ARGS=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "Release $RELEASE_TAG"
              --notes-file release-notes.txt
            )
            if [ "$PUBLISH_RELEASE" = "true" ]; then
              EDIT_ARGS+=(--draft=false)
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              EDIT_ARGS+=(--prerelease)
            else
              EDIT_ARGS+=(--prerelease=false)
            fi
            gh release edit "${EDIT_ARGS[@]}"
            exit 0
          fi

          ARGS=(
            "$RELEASE_TAG"
            --title "Release $RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --notes-file release-notes.txt
          )
          if [ "$PUBLISH_RELEASE" != "true" ]; then
            ARGS+=(--draft)
            echo "Creating DRAFT release $RELEASE_TAG"
          else
            echo "Creating PUBLISHED release $RELEASE_TAG (publish=true)"
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

  bundle_assets:
    needs: [ resolve_release_meta, build, create_release ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_api: linux
            arch_api: x64
            suffix: linux-amd64
            ext: tar.gz
          - os_api: linux
            arch_api: aarch64
            suffix: linux-aarch64
            ext: tar.gz
          - os_api: windows
            arch_api: x64
            suffix: windows-amd64
            ext: zip
          - os_api: mac
            arch_api: x64
            suffix: macos-intel
            ext: tar.gz
          - os_api: mac
            arch_api: aarch64
            suffix: macos-m-series
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch public base from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAINS_RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: .github/scripts/fetch-release-tarball.sh public-base.tar.gz base

      - name: Download JDK 8
        run: |
          set -euo pipefail
          API_URL="https://api.adoptium.net/v3/binary/latest/8/ga/${{ matrix.os_api }}/${{ matrix.arch_api }}/jdk/hotspot/normal/eclipse"

          USE_AZUL="false"
          if [ "${{ matrix.os_api }}" = "mac" ] && [ "${{ matrix.arch_api }}" = "aarch64" ]; then
            USE_AZUL="true"
          fi

          if [ "$USE_AZUL" = "true" ]; then
            AZUL_OS="${{ matrix.os_api }}"
            if [ "$AZUL_OS" = "mac" ]; then
              AZUL_OS="macos"
            fi
            API_URL="https://api.azul.com/zulu/download/community/v1.0/bundles/latest/binary/?jdk_version=8&os=$AZUL_OS&arch=${{ matrix.arch_api }}&bundle_type=jdk&ext=${{ matrix.ext }}"
          fi

          if [ "${{ matrix.ext }}" = "zip" ]; then
            curl -fsSL "$API_URL" -o jdk_bundle.zip
            unzip -q jdk_bundle.zip -d jdk_extracted
          else
            curl -fsSL "$API_URL" -o jdk_bundle.tar.gz
            mkdir jdk_extracted
            tar -xzf jdk_bundle.tar.gz -C jdk_extracted
          fi

          SUBDIR=$(ls jdk_extracted | head -n 1)
          mv "jdk_extracted/$SUBDIR" jdk_final
          if [ "${{ matrix.os_api }}" = "mac" ] && [ -d "jdk_final/Contents/Home" ]; then
            mv jdk_final/Contents/Home jdk_real
            rm -rf jdk_final
            mv jdk_real jdk_final
          fi

      - name: Create Distribution Structure
        run: |
          set -euo pipefail
          DIST_DIR="java-chains-${{ needs.resolve_release_meta.outputs.release_version }}-${{ matrix.suffix }}"
          mkdir -p "$DIST_DIR"

          cp base/java-chains.jar "$DIST_DIR/"
          cp -r base/chains-config "$DIST_DIR/"
          mv jdk_final "$DIST_DIR/jdk"

          echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"

      - name: Generate Start Scripts
        run: |
          set -euo pipefail
          cd "${{ env.DIST_DIR }}"
          if [ "${{ matrix.os_api }}" != "windows" ]; then
            printf '%s\n' \
              '#!/bin/bash' \
              'BASE_DIR=$(cd "$(dirname "$0")" && pwd)' \
              'cd "$BASE_DIR"' \
              'exec "$BASE_DIR/jdk/bin/java" -jar "$BASE_DIR/java-chains.jar"' \
              > start.sh
            chmod +x start.sh
          else
            printf '%s\r\n' \
              '@echo off' \
              'set "BASE_DIR=%~dp0"' \
              'cd /d "%BASE_DIR%"' \
              '"%BASE_DIR%jdk\bin\java.exe" -jar "%BASE_DIR%java-chains.jar"' \
              'pause' \
              > start.bat
          fi

      - name: Compress and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.resolve_release_meta.outputs.release_tag }}"
          ASSET_NAME="${{ env.DIST_DIR }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip -r -q -1 "$ASSET_NAME" "${{ env.DIST_DIR }}"
          else
            tar -I 'gzip -1' -cf "$ASSET_NAME" "${{ env.DIST_DIR }}"
          fi

          gh release upload "$RELEASE_TAG" "$ASSET_NAME" --clobber --repo "$GITHUB_REPOSITORY"

  upload_standard_assets:
    needs: [ resolve_release_meta, build, create_release ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch public base from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAINS_RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: .github/scripts/fetch-release-tarball.sh public-base.tar.gz base

      - name: Create and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ needs.resolve_release_meta.outputs.release_tag }}"
          RELEASE_VERSION="${{ needs.resolve_release_meta.outputs.release_version }}"
          cd base
          test -f java-chains.jar
          test -f java-chains-cli.jar
          test -d chains-config

          mkdir cli_dist
          cp java-chains-cli.jar cli_dist/
          cp -r chains-config cli_dist/

          tar -I 'gzip -1' -cf "java-chains-${RELEASE_VERSION}.tar.gz" \
            java-chains.jar chains-config &
          SERVER_ARCHIVE_PID=$!
          tar -I 'gzip -1' -cf "java-chains-cli-${RELEASE_VERSION}.tar.gz" \
            -C cli_dist . &
          CLI_ARCHIVE_PID=$!

          wait "$SERVER_ARCHIVE_PID"
          wait "$CLI_ARCHIVE_PID"

          gh release upload "$RELEASE_TAG" \
            "java-chains-${RELEASE_VERSION}.tar.gz" \
            "java-chains-cli-${RELEASE_VERSION}.tar.gz" \
            --clobber --repo "$GITHUB_REPOSITORY"

  docker_build:
    if: needs.resolve_release_meta.outputs.publish_release == 'true'
    needs: [ resolve_release_meta, build ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch public base from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAINS_RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: .github/scripts/fetch-release-tarball.sh public-base.tar.gz base

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          cp base/java-chains.jar .
          rm -rf chains-config
          cp -r base/chains-config .
          test -f java-chains.jar
          test -d chains-config
          ls -la

      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push ${{ matrix.platform }} by digest
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=javachains/javachains,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=java-chains-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=java-chains-${{ matrix.suffix }}

      - name: Publish image digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
          RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          DIGEST_FILE="docker-digest-${{ matrix.suffix }}.txt"
          printf '%s\n' "${IMAGE_DIGEST#sha256:}" > "$DIGEST_FILE"
          gh release upload "$RELEASE_TAG" "$DIGEST_FILE" --clobber --repo "$GITHUB_REPOSITORY"

  docker_merge:
    if: needs.resolve_release_meta.outputs.publish_release == 'true'
    needs: [ resolve_release_meta, docker_build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download image digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-digests
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'docker-digest-*.txt' \
            --dir /tmp/docker-digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Create and verify multi-platform image
        shell: bash
        env:
          DOCKER_TAGS: ${{ needs.resolve_release_meta.outputs.docker_tags }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          DIGEST_FILES=(/tmp/docker-digests/docker-digest-*.txt)
          [ "${#DIGEST_FILES[@]}" -eq 2 ] || {
            echo "Expected 2 Docker digests, found ${#DIGEST_FILES[@]}"
            ls -la /tmp/docker-digests || true
            exit 1
          }

          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=(--tag "$tag")
          done <<< "$DOCKER_TAGS"
          [ "${#TAG_ARGS[@]}" -gt 0 ] || {
            echo "No Docker tags resolved"
            exit 1
          }

          DIGEST_REFS=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            digest="$(tr -d '[:space:]' < "$digest_file")"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              digest="${digest#sha256:}"
            fi
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || {
              echo "Invalid Docker digest file: $digest_file ($digest)"
              exit 1
            }
            DIGEST_REFS+=("javachains/javachains@sha256:${digest}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            INSPECT_OUTPUT="$(docker buildx imagetools inspect "$tag")"
            printf '%s\n' "$INSPECT_OUTPUT"
            for required_platform in linux/amd64 linux/arm64; do
              grep -Eq "Platform:[[:space:]]+${required_platform}([[:space:]]|$)" \
                <<< "$INSPECT_OUTPUT" || {
                  echo "Docker tag $tag is missing $required_platform"
                  exit 1
                }
            done
          done <<< "$DOCKER_TAGS"

  cleanup_handoff:
    name: remove public-base handoff from download list
    if: always() && needs.build.result == 'success'
    needs:
      - resolve_release_meta
      - build
      - create_release
      - bundle_assets
      - upload_standard_assets
      - docker_build
      - docker_merge
    runs-on: ubuntu-latest
    steps:
      - name: Delete public-base.tar.gz from the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve_release_meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$names" | grep -qx 'public-base.tar.gz'; then
            gh release delete-asset "$RELEASE_TAG" public-base.tar.gz --yes --repo "$GITHUB_REPOSITORY"
          fi

